name: Ratings Agent

on:
  schedule:
    # Midnight ET is 04:00 UTC during EDT and 05:00 UTC during EST.
    - cron: "0 5 * * *"   # hits midnight during EST
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GitHub Actions runners are ephemeral, so persist the price-target snapshot
      # across runs. The key rotates per run; restore-keys grabs the latest prior
      # snapshot so each run compares against the previous one.
      - name: Restore price-target snapshot
        uses: actions/cache@v4
        with:
          path: agents/ratings_agent/data/price_targets.snapshot.json
          key: ratings-pt-snapshot-${{ github.run_id }}
          restore-keys: |
            ratings-pt-snapshot-

      - name: Run ratings agent
        env:
          # Required
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:         ${{ secrets.OPENAI_MODEL }}
          # Ratings-agent-specific
          WATCHLIST_CSV:        ./common/data/watchlist.csv
          RATINGS_PT_SNAPSHOT:  ./agents/ratings_agent/data/price_targets.snapshot.json
        run: |
          python -m agents.ratings_agent.main
